spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: 'jdbc:h2:mem:payment'
    username: test
    password: 1234

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
      properties:
        hibernate:
          format_sql: true



server:
  port: 8080



